name: daily-refresh

# Triggered at 7:00 Pacific/Auckland by cron-job.org via the workflow_dispatch API
on: workflow_dispatch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r pipeline/requirements.txt
      - run: python run.py
        working-directory: pipeline
      # Pages are rebuilt from D1 on the next visit after this call
      - name: Invalidate dashboard cache
        run: |
          curl -fsS --max-time 25 --retry 3 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/refresh/complete"
      - name: Alert on failure
        if: failure()
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d '{"content": "daily-refresh failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
